<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disney Snow White</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <a href="#" class="logo-link">
                <img src="images/logo.png" alt="Disney Logo" class="logo">
            </a>
            <ul class="nav-links">
                <li><a href="#">DISNEY+</a></li>
                <li><a href="#">PARKS & TRAVEL</a></li>
                <li><a href="#">MOVIES</a></li>
                <li><a href="#">SHOP</a></li>
                <li><a href="#">MORE</a></li>
            </ul>
        </div>
        <div class="nav-right">
            <a href="#" class="login-link">LOG IN</a>
            <div class="search-container">
                <input type="text" placeholder="Search" class="search-input">
                <button class="search-button">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="search-icon">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <main class="hero">
        <div class="hero-content">
            <img src="images/snow-white.png" alt="Disney Snow White" class="movie-logo">
            <p class="hero-text">Experience <i>Snow White</i>, now playing only in theaters!</p>
            <div class="hero-buttons">
                <a href="#" class="btn btn-primary">Get Tickets Now</a>
                <a href="#" class="btn btn-secondary">Learn More</a>
            </div>
        </div>
    </main>
</body>
</html>
